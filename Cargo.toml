[package]
name = "cipherrun"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Marc Rivero <@seifreed>"]
description = "A fast, modular, and scalable TLS/SSL security scanner written in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/seifreed/cipherrun"
homepage = "https://github.com/seifreed/cipherrun"
documentation = "https://docs.rs/cipherrun"
readme = "README.md"
keywords = ["security", "tls", "ssl", "scanner", "cryptography"]
categories = ["command-line-utilities", "cryptography", "network-programming"]

include = [
    "src/**/*",
    "crates/**/*",
    "data/**/*.json",
    "data/**/*.yaml",
    "data/**/*.yml",
    "data/**/*.txt",
    "data/**/*.pem",
    "data/**/*.css",
    "migrations/**/*.sql",
    "schemas/**/*",
    "fixtures/**/*.json",
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
]

[workspace]
members = [
    "crates/cipherrun-core",
    "crates/cipherrun-cli",
    "crates/cipherrun-data",
    "crates/cipherrun-probes",
    "crates/cipherrun-server",
    "crates/cipherrun-worker",
    "crates/cipherrun-policy",
    "crates/cipherrun-protocol",
]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[features]
default = [
    "api",
    "email",
    "monitoring",
    "pqc",
    "db-sqlite",
    "db-postgres",
    "rustls",
    "openssl-legacy",
]
# Select the ring provider for the full build. Reduced builds use rustls'
# default aws-lc-rs provider so the scanner remains usable without this flag.
rustls = ["rustls/ring"]
# Use the reproducible vendored OpenSSL build for legacy probes. Reduced builds
# can use the system OpenSSL installation instead.
openssl-legacy = ["openssl/vendored"]
api = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:utoipa",
    "dep:uuid",
]
email = ["dep:lettre"]
monitoring = ["ct"]
ct = []
pqc = []
db-sqlite = []
db-postgres = []
# Swagger UI is optional: enabling it requires network access at build time to
# download the Swagger UI bundle. Keep it off by default so the project builds
# and tests fully offline.
swagger = ["api", "dep:utoipa-swagger-ui"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"

# TLS implementations
rustls = { version = "0.23.39" }
rustls-pki-types = "1.10"
tokio-rustls = { version = "0.26", features = ["early-data"] }
webpki-roots = "1.0.7"
openssl = { version = "0.10.80", default-features = false }
openssl-sys = { version = "0.9.116", default-features = false }
foreign-types-shared = "0.1.1"

# Networking
hickory-resolver = "0.26"
ipnetwork = { version = "0.21", features = ["serde"] }

# HTTP client
reqwest = { version = "0.13", features = ["blocking", "json", "rustls", "http3"] }

# Cryptography
ring = "0.17"
x509-parser = { version = "0.18", features = ["verify"] }
pem = "4.0"
md5 = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.3"

# API Server (Axum)
axum = { version = "0.8.9", features = ["ws", "macros"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "compression-full", "trace", "set-header"], optional = true }
utoipa = { version = "5.2", features = ["axum_extras", "chrono", "uuid"], optional = true }
utoipa-swagger-ui = { version = "9.0", features = ["axum"], optional = true }
uuid = { version = "1.23", features = ["v4", "serde"], optional = true }

# Rate limiting
governor = { version = "0.10", default-features = false, features = ["std", "dashmap", "quanta"] }
dashmap = "6.1"

# CLI
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
indicatif = "0.18"

# Terminal output
colored = "3.0"

# Error handling
thiserror = "2.0"

# Utilities
subtle = "2.6"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
bytes = "1.11"
url = "2.5"
urlencoding = "2.1"
rand = "0.10.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

# Parallel processing
parking_lot = "0.12"

# Template engine for HTML output
handlebars = "6.1"

# File handling
tempfile = "3.13"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "chrono", "json", "migrate", "derive", "macros"] }
toml = "1.0"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls"], optional = true }

# Async utilities
futures = "0.3"

# Certificate Transparency

[dev-dependencies]
criterion = "0.8.2"
rcgen = "0.14"
# Enable tokio's test-util (virtual time: pause/advance/start_paused) for tests only.
tokio = { version = "1.52", features = ["test-util"] }
tokio-tungstenite = "0.29"

# Kani formal verification
# Configuration for running `cargo kani` proofs
[package.metadata.kani]
# Enable unstable features for better verification
unstable = ["concrete-playback"]

[[bin]]
name = "cipherrun"
path = "src/main.rs"

[[bin]]
name = "cipherrun-openapi"
path = "src/bin/cipherrun-openapi.rs"
required-features = ["api"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.bench]
inherits = "release"

[[bench]]
name = "input_parsing"
harness = false

[[bench]]
name = "compliance"
harness = false

[[bench]]
name = "pqc_bench"
harness = false
required-features = ["pqc"]

[[test]]
name = "monitor_alert_channel"
required-features = ["monitoring"]

[[test]]
name = "ct_logs_integration"
required-features = ["ct"]

[[example]]
name = "ct_logs_streaming"
required-features = ["ct"]

# API integration tests exercise the optional HTTP server stack.
[[test]]
name = "api_error_response_tests"
required-features = ["api"]

[[test]]
name = "api_auth_tests"
required-features = ["api"]

[[test]]
name = "api_health_tests"
required-features = ["api"]

[[test]]
name = "api_job_queue_tests"
required-features = ["api"]

[[test]]
name = "api_production_server_tests"
required-features = ["api"]

[[test]]
name = "api_ownership_e2e_tests"
required-features = ["api"]

[[test]]
name = "api_models_response"
required-features = ["api"]

[[test]]
name = "api_rate_limit_tests"
required-features = ["api"]

[[test]]
name = "api_routes_basic"
required-features = ["api"]

[[test]]
name = "api_routes_certificates"
required-features = ["api"]

[[test]]
name = "api_routes_certificates_success"
required-features = ["api"]

[[test]]
name = "api_routes_compliance"
required-features = ["api"]

[[test]]
name = "api_routes_history"
required-features = ["api"]

[[test]]
name = "api_routes_policies"
required-features = ["api"]

[[test]]
name = "api_scan_endpoint_tests"
required-features = ["api"]

[[test]]
name = "api_tests"
required-features = ["api"]

[[test]]
name = "api_unit_tests"
required-features = ["api"]

[[test]]
name = "ws_progress"
required-features = ["api"]
