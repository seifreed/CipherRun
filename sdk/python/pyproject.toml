[tool.poetry]
name = "cipherrun_client"
version = "0.5.0"
description = "CipherRun API"
authors = ["CipherRun <security@cipherrun.io>"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/GIT_USER_ID/GIT_REPO_ID"
keywords = ["OpenAPI", "OpenAPI-Generator", "CipherRun API"]
include = ["cipherrun_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"

urllib3 = ">= 2.8.0, < 3.0"
requests = ">=2.32.5, <3.0"
aiohttp = ">=3.13.2, <4.0"
websockets = ">=13.1, <14.0"
python-dateutil = ">=2.8.2"
pydantic = ">=2"
typing-extensions = ">=4.7.1"

[tool.poetry.dev-dependencies]
pytest = ">=9.0.3"
tox = { version = ">=3.9.0", python = ">=3.11" }
virtualenv = { version = ">=21.14.9", python = ">=3.11" }
filelock = { version = ">=4.2.1", python = ">=3.11" }
zipp = ">=3.19.1"
flake8 = ">=4.0.0"
types-python-dateutil = ">=2.8.19.14"
mypy = "1.4.1"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
  "cipherrun_client",
  #"test",  # auto-generated tests
  "tests", # hand-written tests
]
# TODO: enable "strict" once all these individual checks are passing
# strict = true

# List from: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

## Getting these passing should be easy
strict_equality = true
strict_concatenate = true

## Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

## These shouldn't be too much additional work, but may be tricky to
## get passing if you use a lot of untyped libraries
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

### These next few are various gradations of forcing use of type annotations
#disallow_untyped_calls = true
#disallow_incomplete_defs = true
#disallow_untyped_defs = true
#
### This one isn't too hard to get passing, but return on investment is lower
#no_implicit_reexport = true
#
### This one can be tricky to get passing if you use a lot of untyped libraries
#warn_return_any = true
