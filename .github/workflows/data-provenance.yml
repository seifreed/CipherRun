name: Refresh data provenance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: Trust store target to refresh
        required: true
        default: mozilla
        type: choice
        options:
          - mozilla
          - apple
          - android
          - java
          - windows
          - all
      refresh_debian:
        description: Rebuild the large Debian weak-key corpus
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target || 'mozilla' }}
      REFRESH_DEBIAN: ${{ inputs.refresh_debian || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh trust store and provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/trust-stores-manifest.json"
          CIPHERRUN_TRUST_MANIFEST="$manifest" scripts/update-trust-stores.sh "$TARGET"

          if ! git diff --quiet -- data/*.pem; then
            cp "$manifest" data/trust-stores-manifest.json
          fi

          if [[ "$REFRESH_DEBIAN" == "true" ]]; then
            scripts/gen_debian_blacklist.sh
          fi

          scripts/validate-rule-pack-provenance.sh "${RUNNER_TEMP}/rule-pack-manifest.json"
          scripts/validate-trust-store-provenance.sh "$manifest"

      - name: Open provenance update pull request
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data; then
            echo "No tracked data changes detected"
            exit 0
          fi

          branch="automation/data-provenance-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data
          git commit -m "chore(data): refresh trust stores and fingerprints"
          git push --set-upstream origin "$branch"
          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(data): refresh trust stores and fingerprints" \
            --body "Automated provenance refresh from the scheduled data workflow. Review the generated manifest and source changes before merging."; then
            echo "::warning::GitHub Actions cannot create pull requests with the repository token; review $branch manually."
          fi
