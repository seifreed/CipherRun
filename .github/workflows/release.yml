name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Validate tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cipherrun") | .version')"

          if [[ "$tag" == "$version" || -z "$version" || "$version" != "$package_version" ]]; then
            echo "Tag $tag does not match Cargo package version $package_version"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install cargo-audit
        uses: taiki-e/install-action@4b8992af23a2be34fd58f8d9b50d3f4939ad1891 # cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@d188fec832a53ccc1d60b19754dd398708da38e9 # cargo-deny

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4f5ee4a4759116abc6b10af05f20374e179d8ca3 # cargo-semver-checks

      - name: Run quality gates
        run: bash scripts/quality-gates.sh

      - name: Build and smoke-test production image
        run: |
          docker build --tag cipherrun:release .
          docker run --rm cipherrun:release --version

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$env:TARGET"
        if: runner.os == 'Windows'

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
        shell: bash
        if: runner.os != 'Windows'

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          root="cipherrun-${RELEASE_TAG}-${TARGET}"
          mkdir -p "package/${root}" release
          cp "target/${TARGET}/release/cipherrun" "package/${root}/cipherrun"
          cp LICENSE README.md "package/${root}/"
          archive="release/${root}.tar.gz"
          tar -C package -czf "$archive" "$root"
          hash="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "$(basename "$archive")" > "${archive}.sha256"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $root = "cipherrun-$env:RELEASE_TAG-$env:TARGET"
          $staging = "package/$root"
          New-Item -ItemType Directory -Force -Path $staging, release | Out-Null
          Copy-Item "target/$env:TARGET/release/cipherrun.exe" "$staging/cipherrun.exe"
          Copy-Item LICENSE, README.md $staging
          $archive = "release/$root.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish crate
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "Repository secret CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi

          if curl --fail --silent --show-error "https://crates.io/api/v1/crates/cipherrun/${VERSION}" > /dev/null; then
            echo "cipherrun ${VERSION} is already published; continuing"
          else
            cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
          fi

  release:
    name: Create GitHub Release
    needs: [validate, build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums manifest
        shell: bash
        run: |
          shasum -a 256 dist/*.tar.gz dist/*.zip | sed 's#dist/##' > dist/SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@6b92ff5b2cce1787a99198f282dd8a26d1991449 # main
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/cipherrun-sbom.cdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CipherRun $TAG" \
            --generate-notes
