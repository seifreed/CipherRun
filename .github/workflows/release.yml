name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose package version should be published
        required: true
        default: v0.4.0
        type: string
      ref:
        description: Git ref containing the release source
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Validate tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cipherrun") | .version')"

          if [[ "$tag" == "$version" || -z "$version" || "$version" != "$package_version" ]]; then
            echo "Tag $tag does not match Cargo package version $package_version"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install cargo-audit
        uses: taiki-e/install-action@4b8992af23a2be34fd58f8d9b50d3f4939ad1891 # cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@d188fec832a53ccc1d60b19754dd398708da38e9 # cargo-deny

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4f5ee4a4759116abc6b10af05f20374e179d8ca3 # cargo-semver-checks

      - name: Run quality gates
        run: bash scripts/quality-gates.sh

      - name: Build and smoke-test production image
        run: |
          docker build --tag cipherrun:release .
          docker run --rm cipherrun:release --version

      - name: Run controlled differential fixtures
        run: make lab-validate

      - name: Run pinned external vulnerable and patched fixtures
        run: make external-fixture

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$env:TARGET"
        if: runner.os == 'Windows'

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
        shell: bash
        if: runner.os != 'Windows'

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          root="cipherrun-${RELEASE_TAG}-${TARGET}"
          mkdir -p "package/${root}" release
          cp "target/${TARGET}/release/cipherrun" "package/${root}/cipherrun"
          cp LICENSE README.md "package/${root}/"
          archive="release/${root}.tar.gz"
          tar -C package -czf "$archive" "$root"
          hash="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "$(basename "$archive")" > "${archive}.sha256"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $root = "cipherrun-$env:RELEASE_TAG-$env:TARGET"
          $staging = "package/$root"
          New-Item -ItemType Directory -Force -Path $staging, release | Out-Null
          Copy-Item "target/$env:TARGET/release/cipherrun.exe" "$staging/cipherrun.exe"
          Copy-Item LICENSE, README.md $staging
          $archive = "release/$root.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish crate
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "Repository secret CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi

          for crate in cipherrun-protocol cipherrun-policy cipherrun-data cipherrun-probes cipherrun-server cipherrun-cli cipherrun-core cipherrun cipherrun-worker; do
            echo "Publishing ${crate} ${VERSION}"
            published=false
            for attempt in 1 2 3 4 5; do
              set +e
              output="$(cargo publish -p "$crate" --locked --token "$CARGO_REGISTRY_TOKEN" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "$output"

              if [[ "$status" -eq 0 ]]; then
                published=true
                break
              fi

              if grep -Eqi 'already exists|already uploaded|crate version .* exists' <<<"$output"; then
                echo "${crate} ${VERSION} is already published; continuing"
                published=true
                break
              fi

              if grep -Eqi '429|too many requests|rate limit' <<<"$output" && [[ "$attempt" -lt 5 ]]; then
                delay=$((attempt * 30))
                echo "crates.io rate limited ${crate}; retrying in ${delay}s"
                sleep "$delay"
                continue
              fi

              echo "Failed to publish ${crate} ${VERSION}" >&2
              exit "$status"
            done

            if [[ "$published" != true ]]; then
              echo "${crate} ${VERSION} was not published" >&2
              exit 1
            fi
          done

  release:
    name: Create GitHub Release
    needs: [validate, build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate package-manager manifests
        env:
          CIPHERRUN_REPOSITORY: ${{ github.repository }}
        run: scripts/generate-package-manifests.sh "${{ needs.validate.outputs.version }}" dist dist

      - name: Export stable contracts
        run: |
          cargo run --quiet --locked --bin cipherrun-openapi --features api > dist/cipherrun-openapi.json
          cp docs/scan-results.schema.json dist/cipherrun-scan-results.schema.json

      - name: Create checksums manifest
        shell: bash
        run: |
          shasum -a 256 dist/*.tar.gz dist/*.zip | sed 's#dist/##' > dist/SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@6b92ff5b2cce1787a99198f282dd8a26d1991449 # main
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/cipherrun-sbom.cdx.json

      - name: Publish and sign production container
        id: container
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$IMAGE" --build-arg CIPHERRUN_VERSION="$VERSION" .
          push_output="$(docker push "$IMAGE" 2>&1 | tee /dev/stderr)"
          digest="$(sed -n 's/^digest: //p' <<<"$push_output" | tail -n 1)"
          if [[ -z "$digest" ]]; then
            repo_digest="$(docker image inspect "$IMAGE" --format='{{index .RepoDigests 0}}')"
            digest="${repo_digest##*@}"
          fi
          [[ "$digest" == sha256:* ]] || {
            echo "Could not resolve immutable image digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "${IMAGE%%:*}" "$digest" > dist/cipherrun-container-digest.txt
          if ! command -v cosign >/dev/null 2>&1; then
            go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
            gopath="$(go env GOPATH)"
            export PATH="${gopath}/bin:$PATH"
          fi
          scripts/sign-container.sh "${IMAGE%%:*}@${digest}"

      - name: Attest production container
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CipherRun $TAG" \
              --generate-notes
          fi
