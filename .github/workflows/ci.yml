name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the active minimum and newest active Python release (eol-cli: 3.15).
        python-version: ["3.12", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: sdk/python/requirements.txt

      - name: Install SDK and test dependencies
        working-directory: sdk/python
        run: |
          python -m pip install -r requirements.txt -r test-requirements.txt
          python -m pip install pytest-cov

      - name: Test Python SDK
        working-directory: sdk/python
        run: python -m pytest --cov=cipherrun --cov=cipherrun_client --cov-fail-under=100 --cov-report=term-missing

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable, latest active Rust (eol-cli: 1.100.0)
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: quality

      - name: Install Rust quality tools
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: |
            cargo-audit
            cargo-deny
            cargo-semver-checks

      - name: Run quality gates
        run: bash scripts/quality-gates.sh

      - name: Build and smoke-test production image
        run: |
          docker build --tag cipherrun:ci .
          docker run --rm cipherrun:ci --version

  rust-channels:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        include:
          - toolchain: stable
            experimental: false
          - toolchain: beta
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}

      - name: Check all targets
        run: cargo check --all-targets --locked

  validation-lab:
    name: Differential TLS validation lab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run controlled differential fixtures
        run: make lab-validate

      - name: Run isolated Opossum parser fixture
        if: always()
        run: make opossum-fixture

      - name: Upload Opossum parser transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opossum-parser-fixture
          path: results/opossum-fixture/
          if-no-files-found: error

      - name: Upload scanner transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-tls-transcripts
          path: results/differential/
          if-no-files-found: error

  external-vulnerable-fixture:
    name: External vulnerable TLS fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable

      - name: Validate pinned vulnerable and patched implementations
        run: make external-fixture

      - name: Upload external fixture transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-vulnerable-fixture-transcripts
          path: results/external-fixture/
          if-no-files-found: warn

  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --all --locked

  build-test-ubuntu:
    name: build-test (ubuntu-latest + PostgreSQL latest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: cipherrun
          POSTGRES_USER: cipherrun
          POSTGRES_PASSWORD: cipherrun-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipherrun -d cipherrun"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ubuntu-latest-postgres-latest

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        env:
          CIPHERRUN_TEST_POSTGRES_URL: postgres://cipherrun:cipherrun-ci-only@localhost:5432/cipherrun
          RUST_TEST_THREADS: "1"
        run: cargo test --all --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8, cargo-llvm-cov 0.9.2
        with:
          tool: cargo-llvm-cov@0.9.2

      - name: Generate coverage (lcov)
        env:
          CIPHERRUN_TEST_POSTGRES_URL: postgres://cipherrun:cipherrun-ci-only@localhost:5432/cipherrun
          OTEL_SERVICE_NAME: cipherrun-coverage
          OTEL_RESOURCE_ATTRIBUTES: service.name=cipherrun-sdk-test
          RUST_TEST_THREADS: "1"
        run: |
          cargo llvm-cov --workspace --all-features --all-targets --locked --lcov --output-path lcov.info
          cargo llvm-cov --workspace report --json --output-path coverage.json
          coverage_percent="$(jq -r '.data[0].totals.lines.percent' coverage.json)"
          printf '### Rust workspace line coverage\n\nMeasured: %s%% (gate: 92.18%%)\n' "$coverage_percent" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v coverage="$coverage_percent" 'BEGIN { exit (coverage >= 92.18) ? 0 : 1 }'; then
            echo "::error::Rust workspace line coverage ${coverage_percent}% is below the 92.18% gate"
            exit 1
          fi

      - name: Archive detailed coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-${{ github.run_id }}
          path: |
            coverage.json
            lcov.info
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: seifreed/CipherRun
          files: lcov.info
