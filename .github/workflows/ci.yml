name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Keep the active minimum covered alongside the newest active Python release.
        python-version: ["3.12", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: sdk/python/requirements.txt

      - name: Install SDK and test dependencies
        working-directory: sdk/python
        run: |
          python -m pip install -r requirements.txt -r test-requirements.txt
          python -m pip install pytest-cov

      - name: Test Python SDK
        working-directory: sdk/python
        run: python -m pytest --cov=cipherrun --cov=cipherrun_client --cov-fail-under=100 --cov-report=term-missing

  quality:
    name: Quality gates
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, latest active Rust (eol-cli: 1.100.0)
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: quality

      - name: Install cargo-audit
        uses: taiki-e/install-action@4b8992af23a2be34fd58f8d9b50d3f4939ad1891 # cargo-audit
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@d188fec832a53ccc1d60b19754dd398708da38e9 # cargo-deny
        with:
          tool: cargo-deny

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4f5ee4a4759116abc6b10af05f20374e179d8ca3 # cargo-semver-checks
        with:
          tool: cargo-semver-checks

      - name: Run quality gates
        run: bash scripts/quality-gates.sh

      - name: Build and smoke-test production image
        run: |
          docker build --tag cipherrun:ci .
          docker run --rm cipherrun:ci --version

  rust-channels:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        include:
          - toolchain: stable
            experimental: false
          - toolchain: beta
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Check all targets
        run: cargo check --all-targets --locked

  validation-lab:
    name: Differential TLS validation lab
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run controlled differential fixtures
        run: make lab-validate

      - name: Run isolated Opossum parser fixture
        if: always()
        run: make opossum-fixture

      - name: Upload Opossum parser transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opossum-parser-fixture
          path: results/opossum-fixture/
          if-no-files-found: error

      - name: Upload scanner transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-tls-transcripts
          path: results/differential/
          if-no-files-found: error

  external-vulnerable-fixture:
    name: External vulnerable TLS fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Validate pinned vulnerable and patched implementations
        run: make external-fixture

      - name: Upload external fixture transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-vulnerable-fixture-transcripts
          path: results/external-fixture/
          if-no-files-found: warn

  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all --locked

  build-test-ubuntu:
    name: build-test (ubuntu-26.04 + PostgreSQL 19.0)
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:19.0
        env:
          POSTGRES_DB: cipherrun
          POSTGRES_USER: cipherrun
          POSTGRES_PASSWORD: cipherrun-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipherrun -d cipherrun"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ubuntu-26.04-postgres-19

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        env:
          CIPHERRUN_TEST_POSTGRES_URL: postgres://cipherrun:cipherrun-ci-only@localhost:5432/cipherrun
        run: cargo test --all --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2, cargo-llvm-cov 0.9.1
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Generate coverage (lcov)
        env:
          CIPHERRUN_TEST_POSTGRES_URL: postgres://cipherrun:cipherrun-ci-only@localhost:5432/cipherrun
          OTEL_SERVICE_NAME: cipherrun-coverage
          OTEL_RESOURCE_ATTRIBUTES: service.name=cipherrun-sdk-test
          RUST_TEST_THREADS: "1"
        run: cargo llvm-cov --workspace --all-features --all-targets --locked --fail-under-lines 88.2 --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: seifreed/CipherRun
          files: lcov.info
