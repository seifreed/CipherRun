name: Kani

on:
  schedule:
    - cron: "43 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    name: Formal verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Kani proofs
        uses: model-checking/kani-github-action@daca1b75a96ce3884435ebaeeb73073ffa7edfbd # main
        with:
          kani-version: "0.67.0"
          command: cargo-kani
