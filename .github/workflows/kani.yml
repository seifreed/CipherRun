name: Kani

on:
  schedule:
    - cron: "43 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    name: Formal verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Kani proofs
        uses: model-checking/kani-github-action@daca1b75a96ce3884435ebaeeb73073ffa7edfbd # main
        with:
          kani-version: "0.67.0"
          command: cargo-kani
