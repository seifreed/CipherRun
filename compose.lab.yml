# SECURITY WARNING: grants packet-capture capabilities. Use only for authorized testing.
services:
  cipherrun-lab:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    init: true
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./captures:/captures
      - ./results:/results
    environment:
      RUST_LOG: info
      PCAP_DIR: /captures
      RESULTS_DIR: /results
    networks:
      - lab
    depends_on:
      legacy-tls:
        condition: service_healthy
      legacy11-tls:
        condition: service_healthy
      weak-tls:
        condition: service_healthy
      modern-tls:
        condition: service_healthy
      breach-tls:
        condition: service_healthy
      sweet32-tls:
        condition: service_healthy
      weak-ciphers-tls:
        condition: service_healthy

  legacy-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "legacy"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1 -cipher AES128-SHA:@SECLEVEL=0 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  legacy11-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "legacy11"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_1 -cipher AES128-SHA:@SECLEVEL=0 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  weak-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "weak"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_2 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  modern-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "modern"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  breach-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "breach"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  sweet32-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "sweet32"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",443),2); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 15

  weak-ciphers-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "weak-ciphers"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",443),2); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 15

networks:
  lab:
    driver: bridge
