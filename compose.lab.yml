# SECURITY WARNING: grants packet-capture capabilities. Use only for authorized testing.
services:
  cipherrun-lab:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    init: true
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./captures:/captures
      - ./results:/results
    environment:
      RUST_LOG: info
      PCAP_DIR: /captures
      RESULTS_DIR: /results
    networks:
      - lab
    depends_on:
      legacy-tls:
        condition: service_healthy
      legacy11-tls:
        condition: service_healthy
      weak-tls:
        condition: service_healthy
      modern-tls:
        condition: service_healthy
      breach-tls:
        condition: service_healthy
      sweet32-tls:
        condition: service_healthy
      crime-tls:
        condition: service_healthy
      crime-patched-tls:
        condition: service_healthy
      heartbleed-tls:
        condition: service_healthy
      heartbleed-patched-tls:
        condition: service_healthy
      weak-ciphers-tls:
        condition: service_healthy
      interop-cert:
        condition: service_completed_successfully
      nginx-interop:
        condition: service_healthy
      apache-interop:
        condition: service_healthy
      haproxy-interop:
        condition: service_healthy
      envoy-interop:
        condition: service_healthy
      caddy-interop:
        condition: service_healthy
      starttls-interop:
        condition: service_healthy
      starttls-negative:
        condition: service_healthy

  legacy-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "legacy"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1 -cipher AES128-SHA:@SECLEVEL=0 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  legacy11-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "legacy11"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_1 -cipher AES128-SHA:@SECLEVEL=0 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  weak-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "weak"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_2 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  modern-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "modern"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  breach-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "breach"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  sweet32-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "sweet32"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",443),2); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 15

  crime-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "crime"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",443),2); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 15

  crime-patched-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "crime-patched"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",443),2); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 15

  heartbleed-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "heartbleed"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",443),2); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 15

  heartbleed-patched-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "heartbleed-patched"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",443),2); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 15

  weak-ciphers-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["/scripts/fixture-server.sh", "weak-ciphers"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",443),2); s.close()'"]
      interval: 2s
      timeout: 2s
      retries: 15

  interop-cert:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command:
      - /bin/bash
      - -ceu
      - |
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 -sha256 \
          -subj "/CN=interop.local" -keyout /certs/key.pem -out /certs/cert.pem
        chmod 644 /certs/key.pem
        cat /certs/cert.pem /certs/key.pem > /certs/server.pem
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop: [ALL]
    volumes:
      - interop-certs:/certs
    networks: [lab]

  nginx-interop:
    image: nginx:1.27-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,size=16m
      - /var/run:rw,nosuid,size=16m
    volumes:
      - ./docker/interop/nginx.conf:/etc/nginx/nginx.conf:ro
      - interop-certs:/certs:ro
    networks: [lab]
    depends_on:
      interop-cert: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ | grep -q nginx"]
      interval: 2s
      timeout: 3s
      retries: 20

  apache-interop:
    image: httpd:2.4-alpine
    read_only: true
    tmpfs:
      - /usr/local/apache2/logs:rw,nosuid,size=16m
      - /tmp:rw,nosuid,size=16m
    cap_drop: [ALL]
    volumes:
      - ./docker/interop/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - interop-certs:/certs:ro
    networks: [lab]
    depends_on:
      interop-cert: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ | grep -q Apache"]
      interval: 2s
      timeout: 3s
      retries: 20

  haproxy-interop:
    image: haproxy:3.1-alpine
    read_only: true
    tmpfs:
      - /var/lib/haproxy:rw,nosuid,size=16m
      - /tmp:rw,nosuid,size=16m
    cap_drop: [ALL]
    volumes:
      - ./docker/interop/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - interop-certs:/certs:ro
    networks: [lab]
    depends_on:
      interop-cert: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ | grep -q haproxy"]
      interval: 2s
      timeout: 3s
      retries: 20

  envoy-interop:
    image: envoyproxy/envoy:v1.31-latest
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    volumes:
      - ./docker/interop/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - interop-certs:/certs:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    networks: [lab]
    depends_on:
      interop-cert: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "envoy --version >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 20

  caddy-interop:
    image: caddy:2.10.0-alpine
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    volumes:
      - ./docker/interop/Caddyfile:/etc/caddy/Caddyfile:ro
      - interop-certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      interop-cert: { condition: service_completed_successfully }
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "caddy version >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 20

  starttls-interop:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["python3", "/scripts/starttls-fixture-server.py", "positive"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop: [ALL]
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; [socket.create_connection((\"127.0.0.1\", p), 2).close() for p in (2525, 2143, 2110, 5222, 55432, 43306, 3389)]'"]
      interval: 2s
      timeout: 3s
      retries: 20

  starttls-negative:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.4.0}
    command: ["python3", "/scripts/starttls-fixture-server.py", "negative"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop: [ALL]
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; [socket.create_connection((\"127.0.0.1\", p), 2).close() for p in (2525, 2143, 2110, 5222, 55432, 43306, 3389)]'"]
      interval: 2s
      timeout: 3s
      retries: 20

networks:
  lab:
    driver: bridge

volumes:
  interop-certs:
  caddy-data:
  caddy-config:
