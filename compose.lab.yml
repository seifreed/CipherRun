# SECURITY WARNING: grants packet-capture capabilities. Use only for authorized testing.
services:
  cipherrun-lab:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.3.2}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.3.2}
    init: true
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./captures:/captures
      - ./results:/results
    environment:
      RUST_LOG: info
      PCAP_DIR: /captures
      RESULTS_DIR: /results
    networks:
      - lab
    depends_on:
      weak-tls:
        condition: service_healthy
      modern-tls:
        condition: service_healthy

  weak-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.3.2}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.3.2}
    command: ["/scripts/fixture-server.sh", "weak"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_2 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  modern-tls:
    image: cipherrun-lab:${CIPHERRUN_VERSION:-0.3.2}
    build:
      context: .
      dockerfile: Dockerfile.lab
      args:
        CIPHERRUN_VERSION: ${CIPHERRUN_VERSION:-0.3.2}
    command: ["/scripts/fixture-server.sh", "modern"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect 127.0.0.1:443 -tls1_3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

networks:
  lab:
    driver: bridge
