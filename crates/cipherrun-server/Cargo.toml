[package]
name = "cipherrun-server"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Stable API-server permission and job-backend contracts for CipherRun"
license = "GPL-3.0-or-later"
repository = "https://github.com/seifreed/cipherrun"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid"] }
