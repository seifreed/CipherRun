[package]
name = "cipherrun-worker"
version = "0.5.0"
edition = "2024"
rust-version = "1.100"
description = "Standalone database-backed CipherRun scan worker"
license = "GPL-3.0-or-later"
repository = "https://github.com/seifreed/cipherrun"
readme = "README.md"

[features]
otel = ["cipherrun/otel"]

[dependencies]
cipherrun = { version = "0.5.0", path = "../.." }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
