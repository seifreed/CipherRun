[package]
name = "cipherrun-protocol"
version = "0.4.0"
edition = "2024"
rust-version = "1.100"
description = "Dependency-light TLS protocol contracts for CipherRun consumers"
license = "GPL-3.0-or-later"
repository = "https://github.com/seifreed/cipherrun"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["json"] }
